[package]
name = "runtimers"
version = "0.1.0"
edition = "2024"
[dependencies]
chrono = "0.4.44"
ctor = "0.8.0"
libc = "0.2.184"
num_cpus = "1.17.0"
rand = "0.10.1"
tiny_http = "0.12.0"
ureq = "3.3.0"

[lib]
crate-type = ["staticlib"] 

#this is bad
[profile.release]
debug = 2                  # full debug info
split-debuginfo = "off"    # embed everything, no split
strip = false
debug-assertions = false
opt-level = 3

